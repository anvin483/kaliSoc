
title: KaliSOC - Suspicious Hidden PowerShell Execution
id: 1d73a5c2-1d7c-4f31-9c55-91f60c2a7b31
status: experimental
description: Detects PowerShell launched with hidden window arguments.
author: KaliSOC
date: 2026/11/04

references:
    - https://attack.mitre.org/techniques/T1059/001/

tags:
    - attack.execution
    - attack.t1059.001

logsource:
    product: windows
    category: process_creation

detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_hidden:
        CommandLine|contains:
            - ' -w hidden'
            - ' -windowstyle hidden'

    condition: selection_image and selection_hidden

falsepositives:
    - Authorized administrative scripts.

level: medium
